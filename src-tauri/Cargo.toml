[package]
name = "embedded-toolbox"
version = "0.1.0"
description = "A desktop toolbox for embedded systems engineers"
authors = ["Embedded Toolbox Contributors"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "embedded_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
serialport = "4"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
probe-rs = "=0.32.0"
target-gen = "=0.32.0"
bincode = { version = "2", features = ["serde"] }
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-fs = "2.6.0"
